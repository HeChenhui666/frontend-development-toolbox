<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>如何打开小火火侧边栏</title>
    <style>
      :root {
        color-scheme: light;
      }
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
          "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
        background: #f6f7fb;
        color: #1f2328;
      }
      .wrap {
        max-width: 720px;
        margin: 0 auto;
        padding: 32px 20px 48px;
      }
      .card {
        background: #ffffff;
        border-radius: 12px;
        box-shadow: 0 12px 32px rgba(0, 0, 0, 0.08);
        padding: 24px;
      }
      h1 {
        font-size: 20px;
        margin: 0 0 12px;
      }
      p {
        margin: 10px 0;
        line-height: 1.6;
      }
      ol {
        margin: 12px 0 0 18px;
        padding: 0;
        line-height: 1.8;
      }
      .tip {
        margin-top: 16px;
        padding: 12px;
        border-radius: 8px;
        background: #f2f6ff;
        color: #2c4aa3;
      }
      .muted {
        color: #6b7280;
        font-size: 13px;
      }
      .highlight {
        font-weight: 600;
        color: #0f172a;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="card">
        <h1>如何在浏览器右侧打开“小火火工具箱”侧边栏</h1>
        <p>
          你的浏览器当前不支持通过右键菜单直接打开扩展侧边栏，但仍可以从
          <span class="highlight">浏览器右上角的侧边栏入口</span> 手动打开。
        </p>
        <ol>
          <li>点击浏览器右上角的“侧边栏”按钮。</li>
          <li>在侧边栏应用列表中找到并选择“小火火工具箱”。</li>
          <li>侧边栏将固定显示在浏览器右侧。</li>
        </ol>
        <div class="tip">
          如果找不到侧边栏入口，请升级 Chrome 或使用支持 Side Panel 的 Chromium 浏览器。
        </div>
        <p class="muted">
          提示：右键菜单仍可使用“侧边浮窗”作为替代方案。
        </p>
      </div>
    </div>
  </body>
</html>
